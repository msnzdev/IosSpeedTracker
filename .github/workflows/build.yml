name: Build unsigned IPA

on:
  workflow_dispatch:      # te deja lanzarlo a mano desde la pestaña "Actions" en GitHub
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto Xcode
        run: xcodegen generate

      - name: Compilar sin firmar
        run: |
          xcodebuild \
            -project SpeedTrackerApp.xcodeproj \
            -scheme SpeedTrackerApp \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build \
            clean build

      - name: Empaquetar en .ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SpeedTrackerApp.app Payload/
          zip -r SpeedTrackerApp.ipa Payload

      - name: Subir el .ipa como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: SpeedTrackerApp-unsigned
          path: SpeedTrackerApp.ipa
