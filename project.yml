name: SpeedTrackerApp

options:
  bundleIdPrefix: com.tuusuario
  deploymentTarget:
    iOS: "17.0"

settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  SpeedTrackerApp:
    type: application
    platform: iOS
    sources:
      - path: SpeedTrackerApp
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "Speed Tracker"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Necesitamos tu ubicación para medir la velocidad durante la ruta."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Necesitamos tu ubicación en segundo plano para seguir midiendo la velocidad con la pantalla bloqueada."
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuusuario.speedtracker
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
